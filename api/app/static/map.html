<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Logistics — Carte Temps Réel</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface2: #f3f4f6;
      --border: #d4d7dd;
      --text: #111111;
      --muted: #4b5563;
      --accent: #0ea5a5;
      --accent-soft: rgba(14, 165, 165, 0.12);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f7f8fa 100%);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 340px;
      min-width: 280px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    #sidebar-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
    }

    #sidebar-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }

      color: var(--muted);
      margin-top: 3px;
    }

      margin-top: 6px;
      padding: 2px 8px;
      background: var(--accent-soft);
      border: 1px solid rgba(14, 165, 165, 0.25);
      border-radius: 999px;
      font-size: 0.7rem;
      color: #0f766e;
    }

      overflow-y: auto;

    }

    /* ── Section titles ── */

      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin: 14px 0 6px;
      padding-left: 2px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;

      align-items: center;

      height: 10px;
      border-radius: 50%;

    .dot-AVAILABLE    { background: #22c55e; }

    .dot-MAINTENANCE  { background: #f59e0b; }
    .dot-OFFLINE      { background: #ef4444; }

    .vehicle-plate {
      font-weight: 700;
      font-size: 0.9rem;

    }

    .vehicle-driver { font-size: 0.78rem; color: #6b7280; margin-bottom: 4px; }

      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }

    .risk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;

    .risk-ref { font-weight: 700; font-size: 0.85rem; }

    .risk-badge {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;

    .risk-HIGH    { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }

    .risk-LOW     { background: #052e16; color: #86efac; border: 1px solid #14532d; }

      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;

      padding: 1px 7px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;

      color: var(--muted);

      font-size: 0.73rem;

      background: #e5e7eb;
      border-radius: 2px;
      margin-top: 6px;

let trafficCircles = {};

    coords: [[50.620,2.975],[50.630,3.020],[50.629,3.057],[50.638,3.110]], travel_min: 35 },
  { name: 'L5',     city: 'Lille', color: '#EE1C25', w: 1,
    coords: [[50.595,3.060],[50.610,3.058],[50.629,3.057],[50.648,3.095]], travel_min: 28 },
];

function interpolateCoords(coords, t) {
  const n = coords.length - 1;
  if (t >= 1) return coords[n];
  const segIdx = Math.floor(t * n);
  const segT   = (t * n) - segIdx;
  const [la1, lo1] = coords[segIdx];
  const [la2, lo2] = coords[Math.min(segIdx + 1, n)];
  return [la1 + (la2 - la1) * segT, lo1 + (lo2 - lo1) * segT];
}

function getVehiclePositions(route) {
  const nowSec    = Date.now() / 1000;
  const travelSec = route.travel_min * 60;
  const hash      = route.name.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const count     = Math.max(2, Math.round(route.travel_min / 10));
  return Array.from({ length: count }, (_, i) => {
    const offset = (i / count) * travelSec;
    const phase  = ((nowSec + offset + hash * 31) % travelSec) / travelSec;
    // Back-and-forth: 0→1 then 1→0
    const t = phase < 0.5 ? phase * 2 : (1 - phase) * 2;
    return interpolateCoords(route.coords, t);
  });
}

function makeTransitDot(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};
             border:2px solid #ffffff;box-shadow:0 0 6px ${color}88"></div>`,
    iconAnchor: [6, 6],
  });
}

// ── Transit type helper ───────────────────────────────────────────────────
function getRouteType(name) {
  if (name.startsWith('RER'))                    return 'RER';
  if (name.startsWith('T3') || name.startsWith('Tram')) return 'Tramway';
  if (name.startsWith('Bus'))                    return 'Bus';
  if (name.startsWith('L'))                      return 'Ligne';
  if (name === 'Eurostar')                       return 'Train';
  return 'Métro';
}

// ── Refresh TC sidebar list ────────────────────────────────────────────────
async function refreshTransitList() {
  const lines = await fetch(`${API}/transit/lines`)
    .then(r => r.ok ? r.json() : []).catch(() => []);

  const statusMap = {};
  lines.forEach(l => { statusMap[`${l.city}|${l.line_name}`] = l.network_status || 'NORMAL'; });

  const el = document.getElementById('transit-list-sidebar');
  if (!el) return;

  const STATUS_TC = {
    NORMAL:    { label: 'Normal',    color: '#22c55e' },
    REDUCED:   { label: 'Réduit',    color: '#f97316' },
    DISRUPTED: { label: 'Perturbé',  color: '#ef4444' },
  };

  function routeCard(r) {
    const vCount = getVehiclePositions(r).length;
    const key    = `${r.city}|${r.name}`;
    const sKey   = statusMap[key] || 'NORMAL';
    const st     = STATUS_TC[sKey] || STATUS_TC.NORMAL;
    const type   = getRouteType(r.name);
    const typeIcon = type === 'Métro' ? '🚇' : type === 'RER' ? '🚆' : type === 'Tramway' ? '🚋' : type === 'Train' ? '🚄' : '🚌';
    return `
      <div class="vehicle-card">
        <div class="vehicle-card-header">
          <span style="display:inline-block;padding:2px 8px;border-radius:5px;
            background:${r.color};color:#fff;font-size:.65rem;font-weight:900;
            min-width:28px;text-align:center;white-space:nowrap">${r.name}</span>
          <span style="margin-left:6px;font-size:.72rem;color:#6b7280">${typeIcon} ${type}</span>
          <span style="margin-left:auto;padding:2px 8px;border-radius:999px;font-size:.65rem;
            font-weight:700;background:${st.color}22;color:${st.color};border:1px solid ${st.color}55">
            ${st.label}
          </span>
        </div>
        <div class="vehicle-meta">
          <span>🚍 ${vCount} veh.</span>
          <span style="color:#6b7280">${r.city}</span>
        </div>
      </div>`;
  }

  const paris = TRANSIT_ROUTES.filter(r => r.city === 'Paris');
  const lille  = TRANSIT_ROUTES.filter(r => r.city === 'Lille');

  el.innerHTML =
    `<div style="font-size:.63rem;color:#0f766e;font-weight:700;margin-bottom:5px;letter-spacing:.06em">🗺 PARIS</div>` +
    paris.map(routeCard).join('') +
    `<div style="font-size:.63rem;color:#0f766e;font-weight:700;margin:10px 0 5px;letter-spacing:.06em">🗺 LILLE</div>` +
    lille.map(routeCard).join('');
}

function toggleTransitLayer() {
  transitVisible = !transitVisible;
  const btn = document.getElementById('transit-toggle');
  if (transitVisible) {
    btn.style.background = '#0f766e';
    btn.style.color = '#fff';
    drawTransitRoutes();
    startTransitAnimation();
  } else {
    btn.style.background = '#ffffff';
    btn.style.color = '#0f766e';
    if (transitLayer) { map.removeLayer(transitLayer); transitLayer = null; }
    transitVehicleMarkers.forEach(m => map.removeLayer(m));
    transitVehicleMarkers = [];
  }
}

function drawTransitRoutes() {
  if (transitLayer) map.removeLayer(transitLayer);
  transitLayer = L.layerGroup();
  TRANSIT_ROUTES.forEach(r => {
    L.polyline(r.coords, {
      color: r.color, weight: r.w + 1, opacity: 0.75,
    })
    .bindTooltip(`<b style="color:${r.color}">${r.name}</b> (${r.city})`, { sticky: true })
    .addTo(transitLayer);
  });
  transitLayer.addTo(map);
}

function refreshTransitVehicles() {
  if (!transitVisible) return;
  transitVehicleMarkers.forEach(m => map.removeLayer(m));
  transitVehicleMarkers = [];
  TRANSIT_ROUTES.forEach(r => {
    getVehiclePositions(r).forEach(pos => {
      const m = L.marker(pos, { icon: makeTransitDot(r.color), zIndexOffset: 500 })
        .bindTooltip(`${r.name}`, { direction: 'top', className: 'city-tooltip' });
      m.addTo(map);
      transitVehicleMarkers.push(m);
    });
  });
}

let _transitAnimInterval = null;
function startTransitAnimation() {
  if (_transitAnimInterval) clearInterval(_transitAnimInterval);
  refreshTransitVehicles();
  _transitAnimInterval = setInterval(refreshTransitVehicles, 8000);
}

// City centre coords for traffic overlays
const CITY_COORDS = {
  Paris: [48.856613, 2.352222],
  Lille: [50.629250, 3.057256],
};

const TRAFFIC_COLOR = {
  FLUID:     '#22c55e',
  SLOW:      '#f97316',
  CONGESTED: '#ef4444',
};

const TRAFFIC_LABEL = {
  FLUID:     'Fluide',
  SLOW:      'Ralenti',
  CONGESTED: 'Congestionné',
};

async function initMap() {
  // Fetch config (Mapbox token + city coords)
  const cfg = await fetch(`${API}/config`).then(r => r.json()).catch(() => ({}));
  mapboxToken = cfg.mapbox_token || '';

  const PARIS = [cfg.paris?.lat ?? 48.856613, cfg.paris?.lon ?? 2.352222];
  const LILLE = [cfg.lille?.lat ?? 50.629250, cfg.lille?.lon ?? 3.057256];
  const MIDPOINT = [(PARIS[0]+LILLE[0])/2, (PARIS[1]+LILLE[1])/2];

  map = L.map('map', { zoomControl: true }).setView(MIDPOINT, 7);

  // Tile layer: Mapbox Streets if token available, else OSM
  if (mapboxToken) {
    L.tileLayer(
      `https://api.mapbox.com/styles/v1/mapbox/light-v11/tiles/{z}/{x}/{y}?access_token=${mapboxToken}`,
      { tileSize: 512, zoomOffset: -1, attribution: '© Mapbox © OpenStreetMap' }
    ).addTo(map);
  } else {
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CartoDB'
    }).addTo(map);
  }

  // Paris & Lille city markers
  const cityIcon = (color) => L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};
            border:2px solid #fff;box-shadow:0 0 8px ${color}"></div>`,
    iconAnchor: [7, 7]
  });

  parisMarker = L.marker(PARIS, { icon: cityIcon('#a78bfa') })
    .addTo(map)
    .bindTooltip('<b>Paris</b>', { permanent: true, direction: 'bottom', className: 'city-tooltip' });

  lilleMarker = L.marker(LILLE, { icon: cityIcon('#a78bfa') })
    .addTo(map)
    .bindTooltip('<b>Lille</b>', { permanent: true, direction: 'top', className: 'city-tooltip' });

  // Route line Paris ↔ Lille
  routeLine = L.polyline([PARIS, LILLE], {
    color: '#0ea5a5', weight: 2, dashArray: '8 6', opacity: 0.6
  }).addTo(map);

  // Initial data load
  await refreshPositions();
  await refreshTraffic();
  await refreshTransitList();

  // Auto-activate transit layer
  transitVisible = true;
  const _btn = document.getElementById('transit-toggle');
  if (_btn) { _btn.style.background = '#0f766e'; _btn.style.color = '#fff'; }
  drawTransitRoutes();
  startTransitAnimation();

  // Auto-refresh every 10s
  startCountdown();
}

// ── Vehicle color by status ────────────────────────────────────────────────
const STATUS_COLOR = {
  AVAILABLE:   '#22c55e',
  IN_TRANSIT:  '#38bdf8',
  MAINTENANCE: '#f59e0b',
  OFFLINE:     '#ef4444',
};

function makeVehicleIcon(status) {
  const c = STATUS_COLOR[status] || '#6b7280';
  const glow = status === 'IN_TRANSIT' ? `box-shadow:0 0 8px ${c};` : '';
  return L.divIcon({
    className: '',
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${c};
            border:2px solid #ffffff;${glow}"></div>`,
    iconAnchor: [9, 9]
  });
}

// ── Refresh vehicle positions ─────────────────────────────────────────────
// Les camions GPS fictifs sont remplacés par les vrais véhicules TC
async function refreshPositions() {
  // Supprimer tout marqueur GPS résiduel
  Object.values(vehicleMarkers).forEach(m => map.removeLayer(m));
  vehicleMarkers = {};
  // Afficher le résumé des véhicules TC dans la sidebar
  renderTransitVehicleSummary();
}

function buildVehiclePopup(v) {
  const c = STATUS_COLOR[v.vehicle_status] || '#6b7280';
  return `
    <div style="font-family:Segoe UI,sans-serif;min-width:180px">
      <b style="color:${c}">${v.license_plate}</b><br>
      <span style="color:#6b7280;font-size:.85em">${v.driver_name}</span><br>
      <hr style="margin:5px 0;border-color:#e5e7eb">
      <span style="font-size:.85em">
        🟢 ${v.vehicle_status}<br>
        ${v.speed != null ? `⚡ ${v.speed.toFixed(0)} km/h<br>` : ''}
        ${v.delivery_reference ? `📦 ${v.delivery_reference}<br>
        ${v.origin} → ${v.destination}` : 'Pas de livraison active'}
      </span>
    </div>`;
}

function renderVehicleList(data) {
  const el = document.getElementById('vehicle-list');
  if (!data.length) { el.innerHTML = '<p style="color:#6b7280;font-size:.8rem">Aucun véhicule.</p>'; return; }

  el.innerHTML = data.map(v => {
    const c = STATUS_COLOR[v.vehicle_status] || '#6b7280';
    const seen = v.last_seen ? new Date(v.last_seen).toLocaleTimeString('fr-FR') : '—';
    return `
      <div class="vehicle-card" onclick="flyTo(${v.latitude},${v.longitude})">
        <div class="vehicle-card-header">
          <span class="status-dot dot-${v.vehicle_status}"></span>
          <span class="vehicle-plate">${v.license_plate}</span>
        </div>
        <div class="vehicle-driver">${v.driver_name}</div>
        <div class="vehicle-meta">
          ${v.speed != null ? `<span>⚡ ${v.speed.toFixed(0)} km/h</span>` : ''}
          <span>🕐 ${seen}</span>
        </div>
        ${v.delivery_reference
          ? `<span class="delivery-badge">📦 ${v.delivery_reference} · ${v.origin} → ${v.destination}</span>`
          : ''}
      </div>`;
  }).join('');
}

function flyTo(lat, lon) { map.flyTo([lat, lon], 13, { duration: 1 }); }

// ── Résumé des véhicules TC dans la sidebar ────────────────────────────────
function renderTransitVehicleSummary() {
  const el = document.getElementById('vehicle-list');
  if (!el) return;

  const TYPE_ORDER = ['Métro', 'RER', 'Tramway', 'Bus', 'Ligne', 'Train'];
  const typeIcon = { Métro: '🚇', RER: '🚆', Tramway: '🚋', Bus: '🚌', Ligne: '🚌', Train: '🚄' };

  // Regrouper par type + ville
  const groups = {};
  for (const r of TRANSIT_ROUTES) {
    const type = getRouteType(r.name);
    const key  = `${type}|${r.city}`;
    if (!groups[key]) groups[key] = { type, city: r.city, routes: [], count: 0, color: r.color };
    groups[key].routes.push(r.name);
    groups[key].count += getVehiclePositions(r).length;
  }

  const cards = Object.values(groups)
    .sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type))
    .map(g => `
      <div class="vehicle-card">
        <div class="vehicle-card-header">
          <span style="font-size:.82rem;font-weight:700;color:#111111">
            ${typeIcon[g.type] || '🚌'} ${g.type}
          </span>
          <span style="margin-left:auto;padding:2px 8px;border-radius:999px;font-size:.65rem;
            font-weight:700;background:#0ea5a522;color:#0f766e;border:1px solid #0ea5a555">
            ● En service
          </span>
        </div>
        <div class="vehicle-meta">
          <span style="color:#6b7280">${g.city}</span>
          <span>🚍 ${g.count} veh.</span>
        </div>
        <div style="font-size:.65rem;color:#6b7280;margin-top:3px">${g.routes.join(' · ')}</div>
      </div>`).join('');

  el.innerHTML = cards || '<p style="color:#6b7280;font-size:.8rem">Aucun véhicule TC.</p>';
}

// ── Refresh traffic overlays ───────────────────────────────────────────────
async function refreshTraffic() {
  const data = await fetch(`${API}/traffic/latest`).then(r => r.json()).catch(() => []);
  const el = document.getElementById('traffic-list');

  // Remove old circles
  Object.values(trafficCircles).forEach(c => map.removeLayer(c));
  trafficCircles = {};

  if (!data.length) {
    el.innerHTML = '<p style="color:#6b7280;font-size:.8rem">Aucune donnée trafic.</p>';
    return;
  }

  el.innerHTML = '';
  for (const city of data) {
    const status = city.traffic_status || 'FLUID';
    const color  = TRAFFIC_COLOR[status] || '#6b7280';
    const coords = CITY_COORDS[city.city];
    const delayMin = Math.round((city.avg_delay_seconds || 0) / 60);
    const maxMin   = Math.round((city.max_delay_seconds  || 0) / 60);

    // Draw semi-transparent circle on the map
    if (coords) {
      trafficCircles[city.city] = L.circle(coords, {
        radius: 12000,
        color:       color,
        fillColor:   color,
        fillOpacity: 0.12,
        weight:      2,
        dashArray:   '6 4',
        opacity:     0.7,
      })
      .addTo(map)
      .bindTooltip(
        `<b>${city.city}</b><br>` +
        `${TRAFFIC_LABEL[status] || status}<br>` +
        `Retard moyen : ${delayMin} min`,
        { sticky: true, className: 'city-tooltip' }
      );
    }

    // Sidebar card
    const routes = (city.routes || []).map(r => {
      const rd = Math.round((r.delay_seconds || 0) / 60);
      const rc = rd > 10 ? '#ef4444' : rd > 3 ? '#f97316' : '#22c55e';
      const name = r.route_name.replace(`${city.city} - `, '');
      return `<div style="display:flex;justify-content:space-between;font-size:.7rem;color:#6b7280;
                padding:3px 0;border-top:1px solid #e5e7eb;margin-top:3px">
                <span>${name}</span>
                <span style="color:${rc};font-weight:700">+${rd} min</span>
              </div>`;
    }).join('');

    el.innerHTML += `
      <div class="vehicle-card" onclick="${coords ? `flyTo(${coords[0]},${coords[1]})` : ''}">
        <div class="vehicle-card-header">
          <span class="status-dot" style="background:${color}${status === 'FLUID' ? '' : ';box-shadow:0 0 6px ' + color}"></span>
          <span class="vehicle-plate">${city.city}</span>
          <span style="margin-left:auto;padding:2px 8px;border-radius:999px;font-size:.68rem;
            font-weight:700;background:${color}22;color:${color};border:1px solid ${color}55">
            ${TRAFFIC_LABEL[status] || status}
          </span>
        </div>
        <div class="vehicle-meta">
          <span>⏱ moy. ${delayMin} min</span>
          <span>⚠ max ${maxMin} min</span>
          <span>🛣 ${city.route_count} axe(s)</span>
        </div>
        ${routes}
      </div>`;
  }
}

// ── Refresh ML risks ───────────────────────────────────────────────────────
async function refreshRisks() {
  const data = await fetch(`${API}/predictions/ml-delay-risk`).then(r => r.json()).catch(() => []);
  const el = document.getElementById('risk-list');

  if (!data.length) { el.innerHTML = '<p style="color:#6b7280;font-size:.8rem">Aucune livraison active.</p>'; return; }

  el.innerHTML = data.map(r => {
    const prob = r.delay_probability != null ? (r.delay_probability * 100).toFixed(0) : null;
    const barColor = r.risk_level === 'HIGH' ? '#ef4444' : r.risk_level === 'MEDIUM' ? '#f97316' : '#22c55e';

    return `
      <div class="risk-card">
        <div class="risk-header">
          <span class="risk-ref">${r.reference}</span>
          <span class="risk-badge risk-${r.risk_level}">${r.risk_level}</span>
        </div>
        <div class="risk-prob">${r.origin} → ${r.destination}</div>
        ${prob != null ? `
        <div class="prob-bar-track">
          <div class="prob-bar-fill" style="width:${prob}%;background:${barColor}"></div>
        </div>
        <div class="risk-prob" style="margin-top:3px">Probabilité de retard : ${prob}%</div>` : ''}
        ${r.risk_factors?.length ? `
        <div class="risk-factors">
          ${r.risk_factors.map(f => `<span class="risk-factor-tag">${f}</span>`).join('')}
        </div>` : ''}
        <div class="risk-reco">${r.recommendation}</div>
      </div>`;
  }).join('');
}

// ── Countdown timer ────────────────────────────────────────────────────────
let _tick = 10;
function startCountdown() {
  setInterval(async () => {
    _tick--;
    if (_tick <= 0) {
      _tick = 10;
      await refreshPositions();
    }
    document.getElementById('countdown').textContent = _tick;
  }, 1000);

  // Traffic & TC refresh every 60s
  setInterval(refreshTraffic, 60_000);
  setInterval(refreshTransitList, 60_000);
}

// ── Boot ──────────────────────────────────────────────────────────────────
initMap();
</script>
