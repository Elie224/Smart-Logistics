services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-logistics-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.15
    container_name: smart-logistics-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  n8n:
    image: n8nio/n8n:2.20.6
    container_name: smart-logistics-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5679}/
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_HOST_PORT:-5679}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

  metabase:
    image: metabase/metabase:v0.56.4
    container_name: smart-logistics-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_HOST_PORT:-3003}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_JETTY_PORT: 3000
      MB_SITE_URL: http://localhost:${METABASE_HOST_PORT:-3003}
      JAVA_TIMEZONE: Europe/Paris
      MB_DISABLE_SESSION_THROTTLE: "true"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: smart-logistics-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MODELS_DIR: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    volumes:
      - models_data:/app/models

  gps-simulator:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: smart-logistics-gps-simulator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GPS_WEBHOOK_URL: http://n8n:5678/webhook/gps-tracking
      GPS_SIMULATOR_CYCLE_SECONDS: ${GPS_SIMULATOR_CYCLE_SECONDS:-300}
    depends_on:
      n8n:
        condition: service_started
    command: >
      sh -c "while true; do
      python /app/scripts/gps_simulator.py --vehicle-ids 1 2 3 --count 1 --interval 1;
      sleep ${GPS_SIMULATOR_CYCLE_SECONDS:-300};
      done"

  transit-simulator:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: smart-logistics-transit-simulator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDFM_API_KEY: ${IDFM_API_KEY}
      TRANSIT_SIMULATOR_CYCLE_SECONDS: ${TRANSIT_SIMULATOR_CYCLE_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python /app/scripts/transit_simulator.py --interval ${TRANSIT_SIMULATOR_CYCLE_SECONDS:-1800}"

  traffic-collector:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: smart-logistics-traffic-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY}
      TRAFFIC_COLLECTOR_CYCLE_SECONDS: ${TRAFFIC_COLLECTOR_CYCLE_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python /app/scripts/traffic_collector.py"

  ml-trainer:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: smart-logistics-ml-trainer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MODELS_DIR: /app/models
      ML_TRAINER_CYCLE_SECONDS: ${ML_TRAINER_CYCLE_SECONDS:-21600}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models_data:/app/models
    command: >
      sh -c "while true; do
      python /app/scripts/ml_trainer.py;
      sleep ${ML_TRAINER_CYCLE_SECONDS:-21600};
      done"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-logistics-frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  pgadmin_data:
  n8n_data:
  models_data:
